# Agent Kernel local development configuration.
session:
  type: in_memory
  cache:
    size: 256

logging:
  ak:
    level: INFO

multimodal:
  enabled: true
  max_attachments: 5
  # LiteLLM model strings (called directly, not via langchain)
  description_model: "gemini/gemini-3.1-flash-lite"
  analysis_model: "gemini/gemini-3.1-flash-lite"

guardrail:
  input:
    enabled: true
    type: openai
    model: gpt-4o-mini
    config_path: guardrails_input.json
  output:
    enabled: true
    type: openai
    model: gpt-4o-mini
    config_path: guardrails_output.json

marketplace:
  # Postgres is the only runtime backend (Phase 18). Override with
  # AK_MARKETPLACE__DATABASE_URL; schema via `alembic upgrade head`.
  database_url: "postgresql+psycopg://agripilot:agripilot@localhost:5432/agripilot"
  jwt_secret: "dev-only-jwt-secret-CHANGE-ME-32-chars-minimum-length-1234"
  jwt_expiry_hours: 24
  signup_url: "http://localhost:8000/docs"

api:
  custom_router_prefix: ""

test:
  mode: fuzzy

whatsapp:
  agent: triage
  verify_token: "agripilot-local-verify"
