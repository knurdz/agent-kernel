# Agent Kernel local development configuration.
session:
  type: in_memory
  cache:
    size: 256

logging:
  ak:
    level: INFO

multimodal:
  enabled: true
  max_attachments: 5
  description_model: "gpt-4o"
  analysis_model: "gpt-4o"

guardrail:
  input:
    enabled: true
    type: openai
    model: gpt-4o-mini
    config_path: guardrails_input.json
  output:
    enabled: true
    type: openai
    model: gpt-4o-mini
    config_path: guardrails_output.json

test:
  mode: fuzzy
