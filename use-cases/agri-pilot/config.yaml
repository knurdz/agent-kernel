# Agent Kernel local development configuration.
session:
  # in_memory keeps bare-metal dev and pytest Redis-free; docker-compose
  # switches to redis via AK_SESSION__TYPE/AK_SESSION__REDIS__URL (Phase 7.1).
  type: in_memory
  cache:
    size: 256
  redis:
    prefix: "ak:agripilot:"
    url: "redis://localhost:6379"
    ttl: 604800

logging:
  ak:
    level: INFO

multimodal:
  enabled: true
  max_attachments: 5
  # LiteLLM model strings (called directly, not via langchain)
  description_model: "gemini/gemini-3.1-flash-lite"
  analysis_model: "gemini/gemini-3.1-flash-lite"
  # in_memory keeps bare-metal dev Redis-free; docker-compose overrides with
  # AK_MULTIMODAL__STORAGE_TYPE=redis so photo binaries survive restarts.
  storage_type: in_memory
  redis:
    url: "redis://localhost:6379"
    prefix: "ak:attachments:"
    ttl: 604800

guardrail:
  input:
    enabled: true
    type: openai
    model: gpt-4o-mini
    config_path: guardrails_input.json
  output:
    enabled: true
    type: openai
    model: gpt-4o-mini
    config_path: guardrails_output.json

marketplace:
  # Postgres is the only runtime backend (Phase 18). Override with
  # AK_MARKETPLACE__DATABASE_URL; schema via `alembic upgrade head`.
  database_url: "postgresql+psycopg://agripilot:agripilot@localhost:5432/agripilot"
  jwt_secret: "dev-only-jwt-secret-CHANGE-ME-32-chars-minimum-length-1234"
  jwt_expiry_hours: 24
  signup_url: "http://localhost:8000/docs"

api:
  custom_router_prefix: ""

test:
  mode: fuzzy

whatsapp:
  agent: triage
  verify_token: "agripilot-local-verify"
