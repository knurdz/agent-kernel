# Agent Kernel local development configuration.
session:
  type: in_memory
  cache:
    size: 256

logging:
  ak:
    level: INFO

multimodal:
  enabled: true
  max_attachments: 5
  # LiteLLM model strings (called directly, not via langchain)
  description_model: "gemini/gemini-3.1-flash-lite"
  analysis_model: "gemini/gemini-3.1-flash-lite"

guardrail:
  input:
    enabled: true
    type: openai
    model: gpt-4o-mini
    config_path: guardrails_input.json
  output:
    enabled: true
    type: openai
    model: gpt-4o-mini
    config_path: guardrails_output.json

test:
  mode: fuzzy

whatsapp:
  agent: triage
  verify_token: "agripilot-local-verify"
