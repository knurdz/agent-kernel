name: agripilot_mobile
description: AgriPilot Android app — farmer/buyer agent chat and marketplace.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  geolocator: ^13.0.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_markdown_plus: ^1.0.12
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
