[project]
name = "agri-pilot"
version = "0.1.0"
description = "Agentic AI agricultural assistant for smallholder farmers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[cli,langgraph,multimodal,chromadb,openai,api,whatsapp]>=0.8.1",
    # 'openai' extra is for the OpenAI moderation/jailbreak guardrail checks
    # (Increment 4.2), independent of which LLM provider answers requests.
    # Pinned: langgraph-prebuilt>=1.0.6 imports ExecutionInfo/ServerInfo
    # from langgraph.runtime, which langgraph 1.0.10 does not provide.
    "fastapi>=0.141.1",
    # Direct HTTP client for the Open-Meteo weather integration
    # (Increment 11.1); already present transitively, declared for the
    # direct import in tools/weather_tool.py.
    "httpx>=0.27",
    "langchain-google-genai>=4.3.4",
    "langgraph-prebuilt==1.0.5",
    "langgraph-supervisor>=0.0.20",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.2.3",
    "torch>=2.2.0",
    "torchvision>=0.28.0",
    "transformers>=4.40.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.8.1",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: downloads model weights or calls an LLM; skip with -m 'not slow'",
]
filterwarnings = [
    # langgraph_supervisor 0.0.31 builds its supervisor agent with the
    # deprecated create_react_agent internally; fixed upstream, not by us.
    "ignore:create_react_agent has been moved to `langchain.agents`.*:DeprecationWarning:langgraph_supervisor.*",
    # langgraph-checkpoint 3.0.1 emits this at import time from its own
    # JsonPlusSerializer default; nothing in our code can pass the flag.
    "ignore:The default value of `allowed_objects` will change.*",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py312"]
