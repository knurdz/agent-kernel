# Production VPS stack for AgriPilot.
# Only Caddy publishes 80/443; Postgres, Redis, and the app stay on the private network.
# Usage: see deploy/deploy-vps.sh and README.md "VPS deployment".

name: agripilot-vps

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agripilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - agripilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-agripilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    networks:
      - agripilot
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    image: agripilot-vps-app
    env_file:
      - path: .env.production
        required: true
    environment:
      AK_MARKETPLACE__DATABASE_URL: postgresql+psycopg://${POSTGRES_USER_ENCODED}:${POSTGRES_PASSWORD_ENCODED}@db:5432/${POSTGRES_DB:-agripilot}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agripilot
    restart: "no"
    logging: *default-logging

  app:
    build:
      context: ../../..
      dockerfile: use-cases/agri-pilot/deploy/Dockerfile
    image: agripilot-vps-app
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: true
    environment:
      AK_MARKETPLACE__DATABASE_URL: postgresql+psycopg://${POSTGRES_USER_ENCODED}:${POSTGRES_PASSWORD_ENCODED}@db:5432/${POSTGRES_DB:-agripilot}
      AK_MARKETPLACE__SIGNUP_URL: https://${DOMAIN}/docs
      AK_SESSION__TYPE: redis
      AK_SESSION__REDIS__URL: redis://redis:6379
      AK_MULTIMODAL__STORAGE_TYPE: redis
      AK_MULTIMODAL__REDIS__URL: redis://redis:6379
      AK_THREAD__TYPE: redis
      AK_THREAD__REDIS__URL: redis://redis:6379
      AGRIPILOT_PLANT_MEDIA_ROOT: /app/data/plant_media
      AGRIPILOT_LISTING_MEDIA_ROOT: /app/data/listing_media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - agripilot
    volumes:
      - chroma-cache:/home/agripilot/.cache/chroma
      - plant-media:/app/data/plant_media
      - listing-media:/app/data/listing_media
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - agripilot
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

networks:
  agripilot:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  chroma-cache:
  plant-media:
  listing-media:
  caddy-data:
  caddy-config:
