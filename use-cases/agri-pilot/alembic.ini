# Alembic configuration for AgriPilot marketplace (Phase 18).
#
# The target database is resolved at runtime by migrations/env.py:
#   1. sqlalchemy.url set here (or programmatically via Config.set_main_option)
#   2. AK_MARKETPLACE__DATABASE_URL env var
#   3. config.yaml marketplace.database_url
#   4. marketplace.database.DEFAULT_URL
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
